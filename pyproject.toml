[project]
name = "soarm-console"
version = "0.1.0"
description = "双臂 SO-101 演示控制台：键盘笛卡尔控制、腕部相机手部对准跟随、深度相机全局引导"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech]==0.7.0",
    "mediapipe>=0.10.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.56"]

[project.scripts]
soarm-console = "soarm.app:main"
soarm-tools = "soarm.tools:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/soarm"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
