# 全新套机的配置模板：复制为 config/config.yaml 后按 docs/QUICK_START.md 第 4 节逐项填写。config.yaml 不入库。
# 手上是已有档案的套机（config/kits/ 下有它的目录）时不要用这个文件，直接复制它的档案。
# 这里只列出必须按本机填写的项；其余参数（限速、跟随增益、工作空间等）的默认值
# 和含义见 backend/soarm/config.py，需要调整时把对应字段写到这里覆盖即可。

# 启动并连接设备后自动进入的模式：idle / keyboard / follow / fused。
# 展示时有外参用 fused（腕部跟随 + 深度引导），没有外参用 follow
# start_mode: idle

# 全局初始位见 config.py 的 home。腕部相机画面是侧的时调整 wrist_roll（默认 -90）。
# home:
#   wrist_roll: -90

arms:
  left:
    port: ""            # soarm-tools scan 输出的串口路径，优先用 /dev/serial/by-id/...
    camera: wrist_left
    # 中柱避让等额外限位（度）。肩部旋转正方向为向右转；默认左臂 [-110, 30]、右臂 [-30, 110]
    # joint_limits:
    #   shoulder_pan: [-110, 30]
    # 腕部跟随方向反了时改成 -1（上真机后各验证一次）
    follow_pan_sign: 1.0
    follow_tilt_sign: 1.0
  right:
    port: ""
    camera: wrist_right
    follow_pan_sign: 1.0
    follow_tilt_sign: 1.0

head:
  # 只在给云台定零点、找刻度时填写；定好之后改回空字符串，云台由舵机力矩保持，
  # 上电后用 soarm-tools head-set 转到工作刻度，控制台不接管它
  port: ""
  pan:  {id: 1, center: 2048, min: 1500, max: 2600}   # 用 soarm-tools head-watch 确定
  tilt: {id: 2, center: 2048, min: 1700, max: 2400}

cameras:
  wrist_left:
    type: opencv
    device: ""          # soarm-tools cameras 输出的 /dev/v4l/by-path/...-usbv2-...-index0 路径
    rotate: 0           # 画面是倒的或侧的时改成 90 / 180 / 270
    width: 1280         # 传感器原生分辨率
    height: 720
    hfov_deg: 90        # 水平视场角估计值，只影响跟随灵敏度
  wrist_right:
    type: opencv
    device: ""
    rotate: 0
    width: 1280
    height: 720
    hfov_deg: 90
  head:
    # enabled: false    # 完全不打开这路相机，把设备留给别的程序
    type: realsense
    device: ""          # soarm-tools cameras 输出的 RealSense 序列号，留空取第一台

# 跟随手感：下面是默认值，觉得慢就调大，觉得抖或来回摆就调小。
# safety:
#   max_joint_speed_deg_s: 180  # 关节限速上限（度/秒）
# follow:
#   single_tracker: false       # true 则两只臂同一时刻至多一只在跟
#   controller: smooth          # 或 legacy（旧的比例限速做法）
#   smooth_time: 0.08           # 越小追得越紧，过小会显得生硬
#   filter_min_cutoff: 1.5      # 越小手不动时越稳，慢动作的滞后越大
#   filter_beta: 0.05           # 越大快动作越跟手，过大会把噪声放进来
#   max_lead_deg: 6.0           # 位置预判上限；调大滞后更小，但手掉头时会冲过头
#   max_speed_deg_s: 150        # 跟随最大转速（度/秒）
#   coast_s: 0.45               # 手出画面后继续追的时间
