# 复制为 config/config.yaml 后按本机情况修改。config.yaml 不入库。
# 这里只列出必须按本机填写的项；其余参数（限速、跟随增益、工作空间等）的默认值
# 和含义见 backend/soarm/config.py，需要调整时把对应字段写到这里覆盖即可。

# 全局初始位见 config.py 的 home。腕部相机画面是侧的时调整 wrist_roll（默认 -90）。
# home:
#   wrist_roll: -90

arms:
  left:
    port: ""            # soarm-tools scan 输出的串口路径，优先用 /dev/serial/by-id/...
    camera: wrist_left
    # 中柱避让等额外限位（度）。肩部旋转正方向为向右转；默认左臂 [-110, 30]、右臂 [-30, 110]
    # joint_limits:
    #   shoulder_pan: [-110, 30]
    # 腕部跟随方向反了时改成 -1（上真机后各验证一次）
    follow_pan_sign: 1.0
    follow_tilt_sign: 1.0
  right:
    port: ""
    camera: wrist_right
    follow_pan_sign: 1.0
    follow_tilt_sign: 1.0

head:
  port: ""              # 留空表示不使用云台
  pan:  {id: 1, center: 2048, min: 1500, max: 2600}   # 用 soarm-tools head-watch 确定
  tilt: {id: 2, center: 2048, min: 1700, max: 2400}

cameras:
  wrist_left:
    type: opencv
    device: ""          # soarm-tools cameras 输出的 /dev/v4l/by-path/...-usbv2-...-index0 路径
    rotate: 0           # 画面是倒的或侧的时改成 90 / 180 / 270
    width: 1280         # 传感器原生分辨率
    height: 720
    hfov_deg: 90        # 水平视场角估计值，只影响跟随灵敏度
  wrist_right:
    type: opencv
    device: ""
    rotate: 0
    width: 1280
    height: 720
    hfov_deg: 90
  head:
    type: realsense
    device: ""          # soarm-tools cameras 输出的 RealSense 序列号，留空取第一台

# 跟随手感：下面是默认值，觉得慢就调大，觉得抖或来回摆就调小。
# safety:
#   max_joint_speed_deg_s: 180  # 关节限速上限（度/秒）
# follow:
#   gain: 9                     # 越大越跟手，过大会抖
#   max_speed_deg_s: 150        # 跟随最大转速（度/秒）
#   smoothing: 0.7              # 越大越跟手，越小越稳
#   lead_s: 0.08                # 向前预判的时间，过冲就调小
#   coast_s: 0.45               # 手出画面后继续追的时间
